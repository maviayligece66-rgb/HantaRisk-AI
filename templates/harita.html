{% extends "base.html" %}

{% block content %}

<section class="text-center mb-5">
    <h1 class="page-title">🌍 Dünya Hantavirüs Risk Haritası</h1>
    <p class="page-subtitle">
        Ülkelere göre hantavirüs risk seviyelerini harita üzerinde görüntüleyin.
    </p>
</section>

{% if hata %}
    <div class="info-section warning-box text-center">
        <h2>⚠️ Harita Yüklenemedi</h2>
        <p>{{ hata }}</p>
    </div>
{% else %}
    <div class="kart harita-kart">
        {{ harita|safe }}
    </div>
{% endif %}

<div class="text-center mt-4">
    <a href="/" class="btn">⬅️ Ana Sayfaya Dön</a>
</div>

{% endblock %}
